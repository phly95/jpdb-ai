<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPDB AI — Jev System One vs Generative LLM Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
    }
    .brand span.tag {
      background: var(--purple);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .stats-bar {
      display: flex;
      gap: 14px;
      font-size: 12px;
    }
    .stat-pill {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .stat-pill strong { color: var(--accent); }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 380px;
      min-width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    .filter-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-input {
      width: 100%;
      background: #1f2937;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .filters-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-select {
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 4px;
      flex: 1;
    }
    .examples-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all .15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-card:hover {
      border-color: var(--accent);
      background: #273549;
    }
    .example-card.active {
      border-color: var(--accent);
      background: #1e3a5f;
      box-shadow: 0 0 0 1px var(--accent);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-score-10 { background: #065f46; color: #34d399; }
    .badge-score-med { background: #78350f; color: #fbbf24; }
    .badge-score-low { background: #7f1d1d; color: #f87171; }
    .badge-fast { background: #0284c7; color: #e0f2fe; }
    .badge-llm { background: #581c87; color: #e9d5ff; }
    .card-sentence {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
    }
    /* Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
      background: var(--bg);
    }
    .detail-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .detail-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-title-bar h2 {
      font-size: 18px;
      font-weight: 700;
    }
    .jp-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .jp-sentence {
      font-size: 20px;
      font-weight: 600;
      color: #38bdf8;
    }
    .jp-sub {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
    .user-draft-box {
      background: #172554;
      border-left: 4px solid var(--accent);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    .routing-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .routing-banner.fast {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .routing-banner.hybrid {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #c4b5fd;
    }
    .excerpt-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .excerpt-pill {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .excerpt-pill span {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .excerpt-pill.student {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .excerpt-pill.student span { color: #ef4444; }
    .excerpt-pill.ref {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #86efac;
    }
    .excerpt-pill.ref span { color: #10b981; }
    .excerpt-arrow {
      color: #64748b;
      font-size: 14px;
    }
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }
    .pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pane-body {
      padding: 16px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      flex: 1;
    }
    .rendered-markdown {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: inherit;
    }
    .decision-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      font-size: 12px;
    }
    .decision-row:last-child { border-bottom: none; }
    .decision-key { color: var(--text-muted); }
    .decision-val { font-weight: 600; color: #38bdf8; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    pre {
      background: #090d16;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      overflow-x: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ JPDB AI System One Explorer</span>
      <span class="tag">Jev-1.13 Decisions + LLM Benchmark</span>
    </div>
    <div class="stats-bar" id="statsBar">
      <div class="stat-pill">Total: <strong id="statTotal">-</strong></div>
      <div class="stat-pill">⚡ Jev Avg: <strong id="statJevTime">-</strong></div>
      <div class="stat-pill">🤖 LLM Avg: <strong id="statLlmTime">-</strong></div>
      <div class="stat-pill">Speedup: <strong id="statSpeedup" style="color:var(--success)">-</strong></div>
      <div class="stat-pill">Cost Diff: <strong style="color:var(--success)">~98% Cheaper</strong></div>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="filter-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Japanese, English, or grammar..." />
        <div class="filters-row">
          <select id="filterMode" class="filter-select">
            <option value="all">All Modes</option>
            <option value="translation_critique">Translation Rating</option>
            <option value="vocab_explanation">Vocab Explanation</option>
          </select>
          <select id="filterScore" class="filter-select">
            <option value="all">All Scores</option>
            <option value="10">10 (Flawless)</option>
            <option value="minor">7-9 (Minor)</option>
            <option value="moderate">4-6 (Moderate)</option>
            <option value="major">1-3 (Major)</option>
          </select>
          <select id="filterRouting" class="filter-select">
            <option value="all">All Routes</option>
            <option value="jev">⚡ Jev Only</option>
            <option value="llm">🤖 LLM Escalated</option>
          </select>
        </div>
      </div>
      <div class="examples-list" id="examplesList"></div>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
      <div style="margin: auto; text-align: center; color: var(--text-muted)">
        Select an example on the left to inspect decisions & live comparison.
      </div>
    </div>
  </div>

  <script>
    let examples = [];
    let currentId = null;

    async function loadData() {
      try {
        const res = await fetch('/api/examples');
        examples = await res.json();
        updateStats();
        renderList();
        if (examples.length > 0) {
          selectExample(examples[0].id);
        }
      } catch (e) {
        console.error('Failed to load examples:', e);
      }
    }

    function updateStats() {
      const computed = examples.filter(e => e.jev && e.llm);
      if (computed.length === 0) return;

      const avgJev = Math.round(computed.reduce((acc, c) => acc + (c.jev.elapsedMs || 0), 0) / computed.length);
      const avgLlm = Math.round(computed.reduce((acc, c) => acc + (c.llm.elapsedMs || 0), 0) / computed.length);
      const speedup = (avgLlm / (avgJev || 1)).toFixed(1) + 'x';

      document.getElementById('statTotal').textContent = examples.length;
      document.getElementById('statJevTime').textContent = avgJev + 'ms';
      document.getElementById('statLlmTime').textContent = avgLlm + 'ms';
      document.getElementById('statSpeedup').textContent = speedup;
    }

    function filterExamples() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const mode = document.getElementById('filterMode').value;
      const score = document.getElementById('filterScore').value;
      const route = document.getElementById('filterRouting').value;

      return examples.filter(ex => {
        if (mode !== 'all' && ex.mode !== mode) return false;
        
        if (score !== 'all') {
          const s = ex.jev?.score;
          if (score === '10' && s !== 10) return false;
          if (score === 'minor' && (s < 7 || s > 9)) return false;
          if (score === 'moderate' && (s < 4 || s > 6)) return false;
          if (score === 'major' && (s < 1 || s > 3)) return false;
        }

        if (route !== 'all') {
          const isJevOnly = ex.routing?.isPureJevFastPath;
          if (route === 'jev' && !isJevOnly) return false;
          if (route === 'llm' && isJevOnly) return false;
        }

        if (q) {
          const text = `${ex.title} ${ex.category} ${ex.card.sentenceJP} ${ex.card.sentenceEN} ${ex.card.vocab} ${ex.userDraft || ''}`.toLowerCase();
          if (!text.includes(q)) return false;
        }

        return true;
      });
    }

    function renderList() {
      const listEl = document.getElementById('examplesList');
      const filtered = filterExamples();
      listEl.innerHTML = '';

      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'example-card' + (ex.id === currentId ? ' active' : '');
        item.onclick = () => selectExample(ex.id);

        let scoreBadge = '';
        if (ex.jev?.score !== undefined) {
          const s = ex.jev.score;
          const cls = s === 10 ? 'badge-score-10' : (s >= 7 ? 'badge-score-med' : 'badge-score-low');
          scoreBadge = `<span class="badge ${cls}">${s}/10</span>`;
        } else if (ex.jev?.role) {
          scoreBadge = `<span class="badge" style="background:#2b2250;color:#c4b5fd;border:1px solid #6366f1;">${escapeHtml(ex.jev.role.replace(/_/g, ' '))}</span>`;
        }

        const isJevOnly = ex.routing?.isPureJevFastPath;
        const routeBadge = isJevOnly 
          ? `<span class="badge badge-fast">⚡ Jev Fast-Path</span>` 
          : `<span class="badge badge-llm">🤖 LLM Compared</span>`;

        item.innerHTML = `
          <div class="card-top">
            <span class="card-title">${escapeHtml(ex.title)}</span>
            ${scoreBadge}
          </div>
          <div class="card-sentence">${escapeHtml(ex.card.sentenceJP)}</div>
          <div class="card-meta">
            <span>${escapeHtml(ex.category)}</span>
            <span>•</span>
            ${routeBadge}
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectExample(id) {
      currentId = id;
      document.querySelectorAll('.example-card').forEach(el => el.classList.remove('active'));
      const foundEl = Array.from(document.querySelectorAll('.example-card')).find(el => el.textContent.includes(examples.find(e => e.id === id)?.title));
      if (foundEl) foundEl.classList.add('active');

      const ex = examples.find(e => e.id === id);
      if (!ex) return;

      const area = document.getElementById('contentArea');
      const isJevOnly = ex.routing?.isPureJevFastPath;

      area.innerHTML = `
        <div class="detail-header">
          <div class="detail-title-bar">
            <div>
              <h2>${escapeHtml(ex.title)}</h2>
              <span style="font-size: 12px; color: var(--text-muted)">Category: ${escapeHtml(ex.category)} | Mode: ${ex.mode === 'translation_critique' ? 'Translation Rating' : 'Vocab Explanation'}</span>
            </div>
            <div style="display:flex; gap:8px">
              <button class="btn" id="reEvalBtn" onclick="runLiveEvaluation('${ex.id}')">
                <span>⚡ Re-evaluate Live</span>
              </button>
            </div>
          </div>

          <div class="jp-box">
            <div class="jp-sentence">${escapeHtml(ex.card.sentenceJP)}</div>
            <div class="jp-sub">
              <span><strong>Tested Vocab:</strong> ${escapeHtml(ex.card.vocab)} (${escapeHtml(ex.card.reading || '')}) [${escapeHtml(ex.card.pos || '')}]</span>
              <span><strong>Ref:</strong> "${escapeHtml(ex.card.sentenceEN)}"</span>
            </div>
            ${ex.card.meanings ? `
              <div style="font-size:11px; color:#64748b">
                <strong>Meanings:</strong> ${escapeHtml(ex.card.meanings.join('; '))}
              </div>
            ` : ''}
          </div>

          ${ex.userDraft ? `
            <div class="user-draft-box">
              <strong>Student's Translation Draft:</strong> "${escapeHtml(ex.userDraft)}"
            </div>
          ` : ''}

          <div class="routing-banner ${isJevOnly ? 'fast' : 'hybrid'}">
            <span>${isJevOnly ? '⚡' : '🤖'}</span>
            <div>
              <strong>${isJevOnly ? 'Fast Deterministic Jev Route Active' : 'Hybrid Routing / Comparison Active'}</strong>
              <div style="font-size: 11px; opacity: 0.9">${escapeHtml(ex.routing?.decisionReason || '')}</div>
            </div>
          </div>
        </div>

        <div class="comparison-grid">
          <!-- Jev Programmatic View -->
          <div class="pane">
            <div class="pane-header">
              <span>⚡ Student Experience (Jev-Synthesized)</span>
              <span style="color:var(--success); font-size:11px">
                ${ex.jev?.elapsedMs ? `${ex.jev.elapsedMs}ms` : 'Not run'} 
                ${ex.jev?.tokenCost ? `($${ex.jev.tokenCost.toFixed(6)})` : ''}
              </span>
            </div>
            <div class="pane-body">
              ${(function() {
                const st = ex.jev?.answers?.flawed_student_excerpt?.choice;
                const rf = ex.jev?.answers?.correct_reference_excerpt?.choice;
                if (st && rf && st !== rf) {
                  return `
                    <div class="excerpt-box">
                      <div class="excerpt-pill student">
                        <span>Student Excerpt</span>
                        "${escapeHtml(st)}"
                      </div>
                      <div class="excerpt-arrow">➔</div>
                      <div class="excerpt-pill ref">
                        <span>Model Reference</span>
                        "${escapeHtml(rf)}"
                      </div>
                    </div>
                  `;
                }
                return '';
              })()}
              <div class="rendered-markdown">${renderMarkdown(ex.jev?.generatedMarkdown || 'Run evaluation to view synthesized explanation.')}</div>
              
              <details style="margin-top:16px; border-top:1px solid #334155; padding-top:10px;">
                <summary style="font-size:11px; cursor:pointer; color:var(--accent);">🔍 View Jev System One Discrete Decisions</summary>
                <div style="margin-top:8px;">
                  ${renderJevDecisionsTable(ex.jev?.answers)}
                </div>
              </details>
            </div>
          </div>

          <!-- Generative LLM Comparison -->
          <div class="pane">
            <div class="pane-header">
              <span>🤖 Generative LLM (Gemini 3.5 Flash Lite)</span>
              <span style="color:var(--text-muted); font-size:11px">
                ${ex.llm?.elapsedMs ? `${ex.llm.elapsedMs}ms (${ex.speedup || ''} slower)` : 'Not run'}
              </span>
            </div>
            <div class="pane-body">
              <div class="rendered-markdown">${renderMarkdown(ex.llm?.content || 'Run evaluation to compare with LLM.')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderJevDecisionsTable(answers) {
      if (!answers) return '<div style="font-size:11px; color:#64748b">No raw decisions available.</div>';
      return Object.entries(answers).map(([key, val]) => {
        let display = '';
        if (val.type === 'noul') display = `Noul: ${(val.noul * 100).toFixed(0)}%`;
        else if (val.type === 'choice') display = `${val.choice} (conf: ${((val.confidence || 0) * 100).toFixed(0)}%)`;
        else if (val.type === 'score') display = `Score: ${val.score}`;
        return `
          <div class="decision-row">
            <span class="decision-key">${escapeHtml(key)}</span>
            <span class="decision-val">${escapeHtml(display)}</span>
          </div>
        `;
      }).join('');
    }

    async function runLiveEvaluation(id) {
      const ex = examples.find(e => e.id === id);
      if (!ex) return;

      const btn = document.getElementById('reEvalBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> <span>Calling Live APIs...</span>`;
      }

      try {
        const res = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: ex.id,
            mode: ex.mode,
            card: ex.card,
            userDraft: ex.userDraft
          })
        });
        const updated = await res.json();
        
        // Update in memory
        const idx = examples.findIndex(e => e.id === id);
        if (idx >= 0) examples[idx] = updated;

        updateStats();
        renderList();
        selectExample(id);
      } catch (err) {
        alert('Evaluation failed: ' + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>⚡ Re-evaluate Live</span>`;
        }
      }
    }

    function renderMarkdown(str) {
      if (!str) return '';
      let html = escapeHtml(str);
      html = html.replace(/^### (.*$)/gim, '<h3 style="margin: 8px 0 4px 0; color: #93c5fd; font-size: 14px;">$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2 style="margin: 10px 0 6px 0; color: #bfdbfe; font-size: 15px;">$1</h2>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/\n\n/g, '<p style="margin: 6px 0;"></p>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('filterMode').addEventListener('change', renderList);
    document.getElementById('filterScore').addEventListener('change', renderList);
    document.getElementById('filterRouting').addEventListener('change', renderList);

    loadData();
  </script>
</body>
</html>
